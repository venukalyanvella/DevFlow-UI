
<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-brand">
    <a routerLink="/dashboard" class="brand-link">
      <span class="brand-logo">
        <i class="bi bi-layers-half"></i>
      </span>

      <span class="brand-name" *ngIf="!collapsed">
        DevFlow
      </span>
    </a>

    <button
      type="button"
      class="sidebar-toggle"
      (click)="toggleSidebar.emit()"
      [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-expanded]="!collapsed"
      title="Toggle sidebar"
    >
      <i
        class="bi"
        [ngClass]="collapsed ? 'bi-layout-sidebar' : 'bi-layout-sidebar-inset'"
      ></i>
    </button>
  </div>

  <nav class="sidebar-navigation" aria-label="Main navigation">
    <section
      class="nav-group"
      *ngFor="let group of navigationGroups"
    >
      <div class="nav-group-title" *ngIf="!collapsed">
        {{ group.title }}
      </div>

      <a
        *ngFor="let item of group.items"
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        [title]="collapsed ? item.label : ''"
      >
        <i class="nav-icon bi" [ngClass]="item.icon"></i>

        <span class="nav-label" *ngIf="!collapsed">
          {{ item.label }}
        </span>

        <span class="active-indicator"></span>
      </a>
    </section>
  </nav>

  <div class="sidebar-bottom">
    <div class="workspace-avatar">D</div>

    <div class="workspace-info" *ngIf="!collapsed">
      <span class="workspace-name">DevFlow Workspace</span>
      <span class="workspace-role">Development Team</span>
    </div>

    <i
      *ngIf="!collapsed"
      class="bi bi-three-dots workspace-menu"
    ></i>
  </div>
</aside>
