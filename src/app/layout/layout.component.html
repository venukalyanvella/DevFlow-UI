
<div
  class="app-shell"
  [class.sidebar-collapsed]="isSidebarCollapsed"
>
  <app-sidebar
    (toggleSidebar)="toggleSidebar()"
  ></app-sidebar>

  <div class="app-workspace">
    <app-topbar
      (toggleSidebar)="toggleSidebar()"
    ></app-topbar>

    <main class="content-scroll">
      <div class="content-container">

        <router-outlet></router-outlet>
      </div>
    </main>

    <app-footer></app-footer>
  </div>
</div>
